name: Release plugins
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release metadata
        shell: pwsh
        run: ./scripts/verify-release.ps1
      - name: Build plugins
        shell: pwsh
        run: ./build-all.ps1
      - name: Test RenoDX refresh behavior
        shell: pwsh
        run: |
          node renodx/tests/catalog-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed' }
          ./renodx/tests/run-catalog-tests.ps1
      - name: Publish plugin DLLs
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" renodx/dist/renodx.dll optiscaler/dist/optiscaler.dll THIRD_PARTY_NOTICES.md --verify-tag --notes "Alpha software — expect bugs. Features may be incomplete or behave unexpectedly. If upgrading from v0.1.1, replace the plugin DLLs manually once to switch to the renamed update source." --title "HubcapUI Plugins $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
